spring:
  application:
    name: khedma
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/khedma}
    username: ${DB_USERNAME:khedma}
    password: ${DB_PASSWORD:khedma}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  timezone: Africa/Cairo
  jwt:
    # Must be at least 32 bytes. Override in every non-local environment.
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret}
    ttl: ${JWT_TTL:7d}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Comma-separated. These accounts are always SUPER_ADMIN + APPROVED on login.
  super-admin-emails: ${SUPER_ADMIN_EMAILS:michealsaad11@gmail.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
