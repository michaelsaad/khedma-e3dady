spring:
  application:
    name: khedma
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/khedma}
    username: ${DB_USERNAME:khedma}
    password: ${DB_PASSWORD:khedma}
    hikari:
      # Free-tier Postgres (e.g. Neon) allows few connections; this app needs very few.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # SMTP for verification emails, enabled by setting SPRING_MAIL_HOST (+ SPRING_MAIL_PORT,
  # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). Without a host, codes are logged instead.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Fail fast instead of hanging the signup request when SMTP is unreachable.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${PORT:8080}

app:
  timezone: Africa/Cairo
  jwt:
    # Must be at least 32 bytes. Override in every non-local environment.
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret}
    ttl: ${JWT_TTL:7d}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  otp:
    ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
  mail:
    from: ${MAIL_FROM:no-reply@khedma.local}
    # Brevo transactional email API (HTTPS). When set, it is used instead of SMTP.
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-base-url: https://api.brevo.com
  # Comma-separated. Verified sign-ins with these emails become SUPER_ADMIN + APPROVED.
  super-admin-emails: ${SUPER_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Web Push (browser notifications). Generate the key pair once; leave empty to turn push off.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
    scheduler-enabled: true
    # Spring cron (second minute hour day month weekday), in app.timezone.
    # Evening before the meeting day: remind admins to take attendance.
    friday-reminder-cron: "0 0 18 * * *"
    # Morning after the meeting day: tell admins who missed the last few meetings.
    absence-alert-cron: "0 0 10 * * *"
    absence-missed-meetings: 2
