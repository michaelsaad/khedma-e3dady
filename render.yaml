# Render Blueprint for the API (free plan). Secrets marked `sync: false` are entered in the
# Render dashboard when the Blueprint is created; they are never stored in this repo.
services:
  - type: web
    name: khedma-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon connection, JDBC form: jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        sync: false
      # The Vercel URL of the web app, e.g. https://khedma-e3dady.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Gmail SMTP: use a Google "App password", not the account password.
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
